plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.mqltv'
    compileSdk 34

    // Membaca version.properties untuk auto-update version name (Build Number)
    def versionPropsFile = file('version.properties')
    def versionProps = new Properties()
    if (versionPropsFile.canRead()) {
        versionProps.load(new FileInputStream(versionPropsFile))
    } else {
        versionProps['BUILD_NUMBER'] = '1'
        versionProps.store(versionPropsFile.newWriter(), null)
    }

    def runTasks = gradle.startParameter.taskNames
    // Naikkan angka versi HANYA ketika melakukan Build Production (Release)
    def isProductionBuild = runTasks.any { it.contains("Release") }
    def currentBuildNumber = versionProps['BUILD_NUMBER'].toInteger()
    
    if (isProductionBuild) {
        currentBuildNumber++
        versionProps['BUILD_NUMBER'] = currentBuildNumber.toString()
        versionProps.store(versionPropsFile.newWriter(), null)
    }

    // APK base name
    setProperty("archivesBaseName", "MQLTV")

    defaultConfig {
        applicationId 'com.mqltv'
        minSdk 17
        targetSdk 34
        
        // Version Code HARUS DIUBAH SECARA MANUAL di bawah ini
        versionCode 5
        
        // Version Name otomatis menambahkan Build Number di belakangnya
        versionName "1.0." + currentBuildNumber

        multiDexEnabled true

        // ABI splits control the outputs; no abiFilters here
    }

    // Output APK per ABI (4 files)
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libvlc.so', '**/libvlcjni.so', '**/libc++_shared.so']
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.palette:palette:1.0.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    // OkHttp 3.12.x is the last branch supporting Android 4.0–4.4 (minSdk 14)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // Conscrypt provides modern TLS on Android 4.x devices
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    def media3Version = '1.2.1'
    implementation "androidx.media3:media3-datasource:${media3Version}"
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"

    // Local FFmpeg audio decoder extension (adds support for MP2/etc on devices where platform decoders are missing)
    implementation files('libs/lib-decoder-ffmpeg-release.aar')

    // VLC engine (local AAR)
    implementation files('libs/libvlc-release.aar')
}
