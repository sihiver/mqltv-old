org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# AGP 8.x requires running Gradle with JDK 17.
# If this path doesn't exist on your machine, update it to your local JDK 17 install.
org.gradle.java.home=/snap/android-studio/current/jbr
android.useAndroidX=true
android.enableJetifier=true

# Suppress AGP warning when using compileSdk 35 with AGP 8.2.x.
android.suppressUnsupportedCompileSdk=35

