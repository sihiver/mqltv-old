pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Crosswalk (XWalk) Android Maven repo
        maven { url = uri("https://download.01.org/crosswalk/releases/crosswalk/android/maven2") }
        // Moxtra mirror for Crosswalk AAR (xwalk_core_library)
        maven { url = uri("https://maven.moxtra.com/nexus/content/groups/public") }
    }
}

rootProject.name = "MQLTV"
include(":app")

